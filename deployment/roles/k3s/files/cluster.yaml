# What the cluster needs before abs_admin's workloads go in. Applied by roles/k3s.
apiVersion: v1
kind: Namespace
metadata:
  name: abs-admin
---
# Same as k3s's built-in "local-path" storage (a folder on this server's disk), except that deleting a
# volume claim keeps the folder. With the built-in class, `kubectl delete pvc` deletes the database.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
