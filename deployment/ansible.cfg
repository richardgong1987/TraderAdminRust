# Ansible reads this file only when you run it from this folder: cd deployment
[defaults]
inventory = inventory.yml
# The server's Python is found automatically; this only silences the notice about it.
interpreter_python = auto_silent
# Print task results as readable YAML instead of one long JSON line.
callback_result_format = yaml

[ssh_connection]
# Runs each task over the existing SSH connection instead of copying a file first: much faster.
pipelining = True
